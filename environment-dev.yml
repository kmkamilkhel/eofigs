name: eofigs-dev
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy
  - pandas
  - xarray
  - scipy
  - matplotlib-base>=3.9
  - cartopy
  - matplotlib-scalebar
  - rioxarray
  - geopandas
  - shapely
  - pyproj
  - pypdf
  - dask
  - tqdm
  - pytest
  - pytest-cov
  - pytest-mpl
  - fpdf2
  - ruff
  - pre-commit
  - python-build
  - hatchling
  - mkdocs-material
  - mkdocstrings-python
  - pip
  - pip:
      # conda-forge's cmcrameri 1.10 reports version 0.0.0 (cmcrameri-feedstock#11)
      - cmcrameri>=1.9
