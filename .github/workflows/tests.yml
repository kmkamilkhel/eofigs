name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One group per event and ref; only pull-request runs are cancelled by newer pushes,
# so a manual run can never cancel a build of main.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "ruff>=0.17" build
      - run: ruff check .
      - run: ruff format --check .
      - name: Build the wheel and use it in a clean environment
        run: |
          python -m build --wheel --outdir dist
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-env/bin/python -c "import eofigs; eofigs.set_style('elsevier', font='DejaVu Sans'); fig, ax = eofigs.new_figure('double'); print('wheel ok', eofigs.__version__)"

  citation:
    name: citation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-texgyre fonts-croscore
      - name: Install package
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest --cov --cov-report=term-missing
      - name: Run performance tests (one job)
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        run: pytest -m slow -s --no-cov
      - name: Report coverage total
        run: |
          total=$(coverage report --format=total)
          echo "Coverage total: ${total}%"
          echo "### Coverage (${{ matrix.os }}, Python ${{ matrix.python-version }}): ${total}%" >> "$GITHUB_STEP_SUMMARY"
