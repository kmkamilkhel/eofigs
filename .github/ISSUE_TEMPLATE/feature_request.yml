name: Feature request
description: Suggest a new recipe, variable, journal preset or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The figure or task you have in mind, and why current eofigs functions do not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How the function or option could look (name, arguments, an example call).
  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: Papers, figures or author guidelines that show the expected result.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recipe figure
        - Variable library
        - Journal preset or export
        - Raster handling
        - Documentation
        - Other
    validations:
      required: true
