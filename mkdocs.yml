site_name: eofigs
site_description: Analysis-aware, publication-ready figures for Earth observation research.
site_url: https://kmkamilkhel.github.io/eofigs/
repo_url: https://github.com/kmkamilkhel/eofigs
repo_name: kmkamilkhel/eofigs
copyright: Copyright &copy; 2026 Kaleem Mehmood

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - docs/hooks/gallery.py

# sample data (distributed with its licence in the repository), build scripts and hooks
# are not part of the site
exclude_docs: |
  data/
  scripts/
  hooks/

nav:
  - Home: index.md
  - Gallery: gallery/index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Style and export: style-and-export.md
  - Colours: colours.md
  - Journal presets: journals.md
  - Variables: variables.md
  - Large rasters: rasters.md
  - Study area maps: study-area.md
  - Trends: trends.md
  - Trend maps: trend-map.md
  - Event composites: event-composite.md
  - Accuracy scatters: accuracy-scatter.md
  - Figure sets: figure-sets.md
  - API reference: api.md
  - Changelog: changelog.md
  - Citation: citation.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
