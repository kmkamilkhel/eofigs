[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "eofigs"
dynamic = ["version"]
description = "Analysis-aware, publication-ready figures for Earth observation research."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kaleem Mehmood", email = "kaleemmehmood73@gmail.com" }]
maintainers = [{ name = "Kaleem Mehmood", email = "kaleemmehmood73@gmail.com" }]
keywords = [
    "remote sensing",
    "earth observation",
    "geospatial",
    "cartography",
    "maps",
    "matplotlib",
    "scientific figures",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xarray>=2024.6",
    "scipy>=1.11",
    "matplotlib>=3.9",
    "cartopy>=0.23",
    "cmcrameri>=1.9",
    "matplotlib-scalebar>=0.8",
    "rioxarray>=0.15",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dask = ["dask[array]>=2024.6", "tqdm>=4.66"]
xee = ["xee>=0.1", "earthengine-api>=1.0"]
test = ["pytest>=8", "pytest-cov>=5", "pytest-mpl>=0.17", "dask[array]>=2024.6"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["eofigs[dask,test,docs]", "ruff>=0.17", "pre-commit>=4", "build>=1.2"]

[project.urls]
Homepage = "https://kmkamilkhel.github.io/eofigs/"
Documentation = "https://kmkamilkhel.github.io/eofigs/"
Source = "https://github.com/kmkamilkhel/eofigs"
Issues = "https://github.com/kmkamilkhel/eofigs/issues"
Changelog = "https://github.com/kmkamilkhel/eofigs/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/eofigs/__init__.py"

[tool.hatch.build.targets.sdist]
# Leading slashes anchor the patterns at the root (a bare "README.md" would also match
# docs/data/swat/README.md).
include = [
    "/src/eofigs",
    "/tests",
    "/conftest.py",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eofigs"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-ra --strict-markers --doctest-modules -m \"not slow\""
filterwarnings = [
    "error",
    # older rioxarray releases (the newest need Python 3.13) compose transforms with "*"
    "ignore:Use `@` matmul instead of:PendingDeprecationWarning",
]
markers = ["slow: long-running performance tests"]

[tool.coverage.run]
source = ["eofigs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
